[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "artemis-tr"
version = "0.1.0"
description = "Türkçe, güvenlik kapılı kişisel masaüstü asistanı"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.12.3",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "Send2Trash==1.8.3",
  # Windows'ta sistem IANA saat dilimi veritabanı yok; zoneinfo bunu kullanır (ADR 0027).
  "tzdata==2026.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.14.3",
  "mypy==1.18.2",
  "types-PyYAML==6.0.12.20250915",
]
voice = [
  "faster-whisper==1.2.1",
  "sounddevice==0.5.6",
  "edge-tts==7.3.0",
  "piper-tts==1.8.0",
  "webrtcvad-wheels==2.0.14.post1",
  # ADR 0037: DeepFilterNet3 gürültü engelleme (torch yok; yalnız onnxruntime + numpy).
  "onnxruntime==1.31.0",
  "numpy==2.5.3",
  # ADR 0038: WebRTC yankı giderici (AEC3), yalnız yerel ses işleme modülü kullanılır.
  "livekit==1.1.20",
]
# EMA Lightning yerel Türkçe TTS; torch'u CPU sürümüyle kur: --extra-index-url https://download.pytorch.org/whl/cpu
ema = ["ema-lightning==1.1.2"]
desktop = ["PySide6-Essentials==6.12.0"]
# ADR 0045: Common Voice parquet okuma (değerlendirme corpus'u); uygulama çalışırken gerekmez.
eval = ["pyarrow==25.0.1"]
memory = ["fastembed==0.8.1", "numpy==2.5.3"]
# ADR 0032: tarayıcı MCP sunucusu; ayrıca bir kez `python -m playwright install chromium`.
browser = ["playwright==1.63.0"]

[project.scripts]
artemis = "artemis.channels.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["artemis", "bench"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not disruptive'"
asyncio_mode = "auto"
markers = ["disruptive: Gerçek makinede görünür yan etki; varsayılan çalıştırılmaz"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["artemis", "bench"]

[[tool.mypy.overrides]]
module = ["send2trash.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "TTS.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ema_lightning.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["livekit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

# PySide6 yalnız `[desktop]` ekiyle kurulur; `checks` işinde Qt tipleri Any olur ve
# QWidget/QThread alt sınıfları `misc` hatası verir.
[[tool.mypy.overrides]]
module = [
  "artemis.channels.desktop.app",
  "artemis.channels.desktop.pet",
  "artemis.channels.desktop.settings_panel",
  "artemis.channels.desktop.projects_panel",
  "artemis.channels.desktop.instance",
  "artemis.channels.desktop.provider_section",
]
# Qt yokken Any olan ifadelerdeki ignore'lar `unused-ignore` olur; Qt varken gerekir.
disable_error_code = ["misc", "no-any-return", "unused-ignore"]
