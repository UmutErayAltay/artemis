name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,voice,package]"
          python -m pip install numpy==2.5.3 onnxruntime==1.31.0 livekit==1.1.20

      - name: Resolve and verify version
        id: version
        shell: pwsh
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $pyproject = Get-Content -Path "pyproject.toml" -Raw -Encoding UTF8
          if ($pyproject -notmatch '(?m)^version = "([^"]+)"') {
            throw "pyproject.toml içinde sürüm bulunamadı."
          }
          $version = $Matches[1].Trim()
          $installed = python -c "import importlib.metadata as m; print(m.version('artemis-tr'))"
          if ($installed.Trim() -ne $version) {
            throw "Kurulu paket sürümü ($installed) pyproject.toml ($version) ile eşleşmiyor."
          }
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($tagVersion -ne $version) {
              throw "Etiket sürümü ($tagVersion) pyproject.toml sürümüyle ($version) eşleşmiyor."
            }
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build PyInstaller bundle
        shell: pwsh
        run: |
          python -m PyInstaller packaging/artemis.spec --noconfirm --clean --distpath dist --workpath build/pyinstaller

      - name: Smoke test packaged desktop imports
        # v0.2.5 paketinde numpy alt modülü eksikti ve masaüstü hiç açılmıyordu; testler kaynaktan
        # koştuğu için yakalamadı. Paketli exe masaüstü ve ses zincirini içe aktaramazsa yayın durur.
        shell: pwsh
        run: |
          foreach ($module in @("artemis.channels.desktop.app", "artemis.channels.voice.core", "artemis.channels.voice.stt_catalog")) {
            & "dist/Artemis/artemis-cli.exe" -m $module
            if ($LASTEXITCODE -ne 0) { throw "Paketli exe $module modulunu yukleyemedi (cikis $LASTEXITCODE)" }
          }

      - name: Locate or install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            )
            foreach ($candidate in $candidates) {
              if (Test-Path -Path $candidate) {
                $iscc = Get-Item $candidate
                break
              }
            }
          }
          if ($null -eq $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $isccPath = if ($iscc -is [System.Management.Automation.CommandInfo]) { $iscc.Source } else { $iscc.FullName }
          "ISCC_PATH=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve signing mode
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $signpath = (
            -not [string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN) -and
            -not [string]::IsNullOrEmpty($env:SIGNPATH_ORGANIZATION_ID) -and
            -not [string]::IsNullOrEmpty($env:SIGNPATH_PROJECT_SLUG) -and
            -not [string]::IsNullOrEmpty($env:SIGNPATH_SIGNING_POLICY_SLUG)
          )
          "signpath=$($signpath.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          & "$env:ISCC_PATH" "/DMyAppVersion=$env:APP_VERSION" "packaging\artemis.iss"

      - name: Upload unsigned installer for SignPath
        id: upload_unsigned
        if: ${{ steps.signing.outputs.signpath == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: artemis-unsigned-${{ env.APP_VERSION }}
          path: dist/installer/Artemis-Setup-${{ env.APP_VERSION }}.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign installer via SignPath
        if: ${{ steps.signing.outputs.signpath == 'true' }}
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: default
          connector-url: https://githubactions.signpath.io
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          output-artifact-directory: dist/installer
          wait-for-completion: true

      - name: Unsigned build fallback notice
        if: ${{ steps.signing.outputs.signpath != 'true' }}
        shell: pwsh
        run: |
          $msg = "SignPath secrets are not configured; continuing with unsigned build and SHA256SUMS.txt manifest."
          Write-Host $msg
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Signing Status`n- $msg"

      - name: Generate SHA256SUMS.txt manifest
        shell: pwsh
        run: |
          $installerName = "Artemis-Setup-$env:APP_VERSION.exe"
          $installerPath = Join-Path "dist/installer" $installerName
          if (-not (Test-Path -Path $installerPath)) {
            throw "Kurucu bulunamadı: $installerPath"
          }
          $hash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestPath = "dist/installer/SHA256SUMS.txt"
          [IO.File]::WriteAllText($manifestPath, "$hash  $installerName`n", [Text.UTF8Encoding]::new($false))
          Get-Content -Path $manifestPath

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artemis-windows-${{ env.APP_VERSION }}
          path: |
            dist/installer/Artemis-Setup-*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: artemis-windows-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Artemis ${{ needs.build.outputs.version }}
          files: |
            release-assets/Artemis-Setup-*.exe
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Kurucu henüz imzasızdır (SignPath başvurusu beklemede; SmartScreen uyarabilir).

            Doğrulama (PowerShell): `Get-FileHash .\Artemis-Setup-${{ needs.build.outputs.version }}.exe -Algorithm SHA256` çıktısını `SHA256SUMS.txt` ile karşılaştırın.

            - [Değişiklik günlüğü](https://github.com/UmutErayAltay/artemis/blob/v${{ needs.build.outputs.version }}/CHANGELOG.md)
            - [Code signing policy](https://github.com/UmutErayAltay/artemis/blob/v${{ needs.build.outputs.version }}/docs/CODE_SIGNING_POLICY.md)
            - [Privacy policy](https://github.com/UmutErayAltay/artemis/blob/v${{ needs.build.outputs.version }}/docs/PRIVACY.md)
