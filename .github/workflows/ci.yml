name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m bench.run --sahte
      - run: python -m bench.voice_latency --sahte --iterations 3
      - run: ruff check .
      - run: mypy
  desktop-ui:
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,desktop]"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: pytest -q tests/test_desktop_gui.py
      - run: mypy jarvis/channels/desktop/app.py jarvis/channels/desktop/demo.py tests/test_desktop_gui.py
