# Yollar bu dosyanın bulunduğu dizine göre çözülür.
workspace: ../desktop
state_dir: ../.artemis
audit_path: ../.artemis/audit.jsonl
max_steps: 8
max_seconds: 60
provider_timeout_seconds: 15
max_output_tokens: 1024
# Konuşma bağlamı (ADR 0012): modele verilen önceki tur sayısı; 0 kapatır.
context_turns: 6
persist_memory: true   # Geçmiş ve öz notlar state_dir/memory.sqlite3 içinde (ADR 0025).
context_token_budget: 6000
daily_budget_usd: '1.00'
allow_paid: false
allow_cloud_file_content: false
allow_cloud_clipboard: false
fallback_seconds: 60

# Resmi katalogdan model adını ve güncel milyon-token fiyatlarını doğrulayıp ekleyin.
# API anahtarlarını buraya YAZMAYIN. README ortam değişkenlerini açıklar.
primary_model: ''
fallback_model: null
models: {}
# Kendi OpenAI uyumlu ucunuz (ADR 0033): adres + isteğe bağlı anahtar. Anahtar YAML'a yazılmaz;
# ortamda ARTEMIS_<UC_ID>_API_KEY ya da Kimlik Bilgisi Yöneticisi'nde Artemis/<uc-id> olarak tutulur.
# endpoints:
#   yerel-proxy:
#     base_url: http://127.0.0.1:8317/v1   # http yalnız localhost için; uzak uç https olmalı
#   lm-studio:
#     base_url: http://127.0.0.1:1234/v1
#     api_key: false                       # anahtarsız yerel sunucu; Authorization gönderilmez
# models:
#   proxy-model:
#     provider: openai_compatible
#     endpoint: yerel-proxy
#     model: <sağlayıcının model kimliği>
#     input_per_million: '0'
#     output_per_million: '0'
applications: {}
allow_all_applications: false # Windows Başlat menüsündeki tüm kurulu uygulamalar.
# Temiz turda bu izinli takma adlar yeniden onay almadan kapatılır.
# Dış içerik okunduktan sonraki kapatma yine onay ister.
close_without_confirmation: []

# Ses modelleri önceden ayrıca kurulmalıdır; Artemis çalışma anında indirme yapmaz.
# faster-whisper CUDA/float16 başlangıç profili; CPU için stt_device: cpu,
# stt_compute_type: int8 seçin.
voice:
  wake_word: artemis
  input_device: null # Paneldeki mikrofon seçimi; null sistem varsayılanıdır (ad ya da numara).
  followup_seconds: 8
  sample_rate: 16000
  frame_ms: 20
  vad_aggressiveness: 2
  end_silence_ms: 600
  barge_in_ms: 180 # Eski config uyumluluğu; artık kullanılmaz, söz kesme nihai STT'yi bekler.
  require_wake_during_output: true # Yanıt/yankı aralığında yeni komut açık wake ister.
  continuous_mode: false # true: "artemis" demeden dinler (ADR 0024).
  listening_hotkey: ctrl+space # Masaüstünde sesi aç/kapat (Windows); boş: kapalı.
  # Gürültü engelleme (ADR 0037): DeepFilterNet3, işlemcide çalışır, ekran kartı gerekmez.
  # Model pakete dahildir (indirme yok), yaklaşık 34 ms gecikme ekler. Yankı giderme DEĞİLDİR.
  noise_suppression: false
  noise_suppression_level: orta # hafif (12 dB sınır) | orta (24 dB) | guclu (sınırsız)
  # false (önerilen): temizlenmiş ses yalnız algılamaya (VAD, cümle bitişi, söz kesme, seviye)
  # gider; STT aynı aralığın HAM sesini alır. true: STT de temizlenmiş sesi alır (ADR 0037).
  noise_suppression_stt: false
  echo_cancellation: false # ADR 0038: hoparlörle kullanırken Artemis'in kendi sesini mikrofondan siler.
  echo_delay_ms: 50 # Hoparlör→mikrofon gecikme tahmini; AEC3 kendisi de ayarlar.
  # Verilmezse pakete dahil model (artemis/channels/voice/models/dfn3) kullanılır. Başka bir dizin
  # verilirse içinde aynı sha256'lı dfn3_step.onnx bulunmalıdır; farklı dosya reddedilir.
  # noise_model_dir: ../models/dfn3
  pre_roll_ms: 300
  max_utterance_seconds: 15
  queue_frames: 32
  stt_model: ../models/whisper-small
  stt_device: cuda
  stt_compute_type: float16
  stt_language: tr_en # Türkçe öncelikli; güçlü İngilizce kanıtında en. auto tüm dilleri seçer.
  cuda_library_dirs: [] # Windows: gerektiğinde yerel cublas/cudnn DLL dizinleri.
  stt_vad_filter: true # Sessiz bölümleri STT öncesinde ele.
  stt_min_logprob: -1.0
  stt_max_no_speech: 0.6
  stt_beam_size: 5 # Kesin sonuç; daha yüksek değer daha yavaş olabilir.
  stt_partial_beam_size: 1
  stt_partial_enabled: true # Konuşurken ara tanıma; kısmi metin komut çalıştırmaz.
  stt_hotwords: [] # İsteğe bağlı yerel ipuçları; prompt veya transcript düzeltmesi değildir.
  tts_backend: piper
  tts_local_fallback: true # Edge hatasında yerel sese dön; false seçili sesi korur.
  piper_model: ../models/tr_TR-dfki-medium.onnx
  piper_config: ../models/tr_TR-dfki-medium.onnx.json
  piper_voice: tr_TR-dfki-medium
  edge_voice: ''
  allow_cloud_tts_text: false
  ffmpeg: ffmpeg

# Obsidian vault hafızası (ADR 0015). KAPALI gelir: vault_path verilmedikçe araçlar
# diske dokunmaz. Vault okuması "dosya içeriği" sayılır: turu lekeler ve buluta ancak
# allow_cloud_file_content açıksa gider. Yazma yalnız ekleme kipindedir (mevcut not
# yeniden yazılmaz) ve her seferinde onay ister. Gizli klasörler (.git, .obsidian)
# ve exclude kalıpları aranmaz, okunmaz, yazılmaz.
# memory:
#   vault_path: C:/Users/siz/Vault   # göreli yol bu dosyaya göre çözülür
#   exclude: [daily/, receipts/, knowledge/index.md, knowledge/log.md, 850-Companion/]
#   max_results: 5
#   max_note_chars: 20000
#   # Anlamsal arama için: pip install 'artemis-tr[memory]'; ilk aramada model iner.
#   # Paket veya model yoksa sözcük aramasına dönülür ve sonuçta bu yazılır.
#   embedding_model: null
#   embedding_cache_dir: null        # varsayılan: state_dir/embedding (vault DIŞINDA)

# Telegram (ADR 0016). KAPALI gelir: chat_id verilmedikçe ne araç ne kanal çalışır.
# Bot token'ı BURAYA YAZILMAZ ve YAML'da `token:` alanı yoktur (eklenirse doğrulama
# reddeder). Token yalnız ortam değişkeninden okunur; adını token_env belirler ve
# _TOKEN ile bitmek zorundadır (denetim kaydı değeri bu sayede gizler).
#   Windows: setx ARTEMIS_TELEGRAM_BOT_TOKEN "<BotFather'dan aldığınız token>"
# Chat id'nizi @userinfobot'tan ya da bota mesaj yazdıktan sonra
# https://api.telegram.org/bot<TOKEN>/getUpdates çıktısındaki message.chat.id'den bulun.
# Yalnız bu kimliğe sahip ÖZEL sohbetten gelen mesaj çalıştırılır; grup, başka kullanıcı,
# iletilmiş (forward) ve max_message_age_seconds'tan eski mesajlar çalıştırılmaz.
# Onaylar düğmeyle sorulur; süre dolarsa cevap hayırdır. `artemis telegram` ile başlatılır.
# telegram:
#   chat_id: 123456789
#   token_env: ARTEMIS_TELEGRAM_BOT_TOKEN
#   api_base: https://api.telegram.org
#   request_timeout_seconds: 10
#   poll_timeout_seconds: 25
#   approval_timeout_seconds: 120
#   max_message_age_seconds: 120

# Kod ajanı (ADR 0023/0026). KAPALI gelir: projects boşsa araçlar çalışmaz. Her iş
# tam taslak için onay ister; ajan headless `claude -p` olarak çalışır, yerel commit
# atabilir. Claude Bash/alt ajan araçları SafetyGate dışındadır; OS sandbox yoktur.
# code_agent:
#   projects:
#     artemis: C:/Users/siz/Projects/artemis   # göreli yol bu dosyaya göre çözülür
#   command: claude
#   max_minutes: 20
#   model: null                              # doluysa --model olarak geçilir
#   manager_model: opus                      # örnek CLI takma adı; isteğe bağlı
#   coder_model: sonnet                      # örnek CLI takma adı; isteğe bağlı
#   tester_model: haiku                      # örnek CLI takma adı; isteğe bağlı
#   github_owner: null                       # Ayarlar > GitHub ile de yazılır
#   repos_dir: null                          # kendi repolarınızın klonlandığı klasör
#   auto_sync: true                          # açılışta klonla/fetch et

# Proaktif olaylar (ADR 0027). KAPALI gelir. Açıkken hatırlatma araçları çalışır ve
# `artemis desktop` ile `artemis telegram` süreçleri zamanlayıcıyı çalıştırır (ikisi aynı anda
# açıksa da her olay bir kez teslim edilir). Artemis kapalıyken hiçbir şey çalışmaz.
# Brifing istemini model kuramaz veya değiştiremez; yalnız buradan tanımlanır. Brifing
# gözetimsiz bir model turudur: yalnız okuma araçları çalışır, yan etkili her işlem
# sorulmadan reddedilir. Brifing tanımlamak ücretli model çağrısına izin vermektir;
# daily_budget_usd yine geçerlidir. Gizli içerik (dosya/pano) taşıyan sonuç Telegram'a
# gönderilmez. days: 0 = Pazartesi ... 6 = Pazar.
# proactive:
#   enabled: true
#   timezone: Europe/Istanbul
#   reminder_grace_hours: 12      # kapalıyken kaçan hatırlatma bu süre içinde "gecikmeli" gelir
#   briefing_grace_hours: 2       # daha geç açılırsa brifing o gün çalışmaz
#   max_events_per_day: 20
#   poll_seconds: 30
#   telegram: true                # telegram.chat_id ve token varsa oraya da gönder
#   briefings:
#     - name: sabah
#       at: "08:30"
#       days: [0, 1, 2, 3, 4]
#       prompt: >-
#         Bekleyen hatırlatmalarımı ve kod ajanı işlerinin durumunu kısaca özetle.

# MCP sunucuları (ADR 0028). KAPALI gelir: servers boşken hiçbir süreç başlatılmaz.
# Yalnız stdio (yerel süreç) desteklenir; her çağrıda sunucu yeniden başlatılır ve iş
# bitince kapatılır. Sunucu üçüncü taraf koddur: kendi yaptıkları (ağ, dosya) SafetyGate'in
# dışındadır, kapı yalnız çağrıyı denetler. Her MCP aracı varsayılan olarak yan etkilidir
# ve dışarı giden (outbound) sayılır; sonucu turu lekeler. Sunucunun "readOnly" beyanı
# riski DÜŞÜRMEZ; bir aracı okuma-yalnız saymak için read_only_tools'a siz yazarsınız.
# read_only_tools/confirm_tools sunucunun HAM araç adlarıdır (mcp_<sunucu>_ öneki yok).
# read_only_tools'a yazılan aracın argümanları onay sorulmadan sunucuya (ve onun ağına)
# gider: yalnız gerçekten okuyan ve güvendiğiniz araçları yazın.
# content ZORUNLU: dosya/not/mail gibi kişisel veri döndüren sunucuda "file" seçin; bu
# sonuçlar buluta ve Telegram'a gitmez. Anahtar gerekiyorsa YAML'a yazmayın:
# env_passthrough yalnız ortam değişkeni ADINI listeler, değer o sunucuya aktarılır.
# Araç adları modele mcp_<sunucu>_<araç> olarak görünür.
# mcp:
#   servers:
#     - name: notlar
#       command: npx                     # Windows'ta npx.cmd otomatik çözülür; shell yok
#       args: ["-y", "@modelcontextprotocol/server-filesystem", "C:/Users/siz/Notlar"]
#       content: file
#       timeout_seconds: 20
#       read_only_tools: [read_text_file, list_directory, search_files]
#       confirm_tools: [write_file, move_file]
#       env_passthrough: []
#     # Artemis'in tarayıcı sunucusu (ADR 0032). Önce: pip install -e ".[browser]" ve
#     # python -m playwright install chromium. read_only_tools ÖNERİLMEZ: browse form doldurabilir.
#     - name: browser
#       command: "{python}"              # tam olarak bu: Artemis'in kendi Python'u
#       args: ["-m", "artemis.mcp_servers.browser"]
#       content: text
#       timeout_seconds: 90

# Ekran algısı (ADR 0029). KAPALI gelir. Açıkken "ekranda ne yazıyor" gibi isteklerde
# screen_read aracı etkin pencerenin (ya da istenirse tüm ekranın) metnini Windows'un
# yerel OCR'ıyla okur. HER okuma ekrandaki pencerede onay ister; brifing (gözetimsiz tur)
# ekranı okuyamaz. Görüntü diske yazılmaz ve hiçbir yere gönderilmez; yalnız metin döner.
# Ekran metni dosya/pano gibi gizlidir: allow_cloud_screen false iken bulut modele ve
# Telegram'a verilmez. Türkçe OCR için Windows'ta Türkçe dil paketi gerekir.
# perception:
#   screen_enabled: true
#   allow_cloud_screen: false
#   timeout_seconds: 20

# Pencere ve sistem kontrolü (ADR 0031). Uyku/kapatma/yeniden başlatma her zaman onay ister;
# kapatma bu kadar saniye sonra olur ve "kapatmayı iptal et" ile durdurulabilir (en az 30).
# system_control:
#   shutdown_delay_seconds: 60
#   timeout_seconds: 15

# Bilgisayar kullanımı (ADR 0039). KAPALI gelir; Artemis'in en riskli yeteneğidir. Açıkken
# computer_use(hedef) aracı tek onayla bir oturum başlatır: her adımda birincil ekranın
# görüntüsü `model`e gider, model fare/klavye eylemi döner. Hassas adımlar (gönder, sil, öde,
# alt+f4) ayrıca sorulur; Esc oturumu durdurur. `model` models içinde tanımlı olmalı ve
# GÖRÜNTÜ KABUL ETMELİ (Claude CLI etmez). Ekran görüntüsü buluta yalnız
# perception.allow_cloud_screen: true iken gider; Ollama modeli yerel kalır.
# computer_use:
#   enabled: true
#   model: vision            # models altındaki bir anahtar
#   max_steps: 25            # 1-100
#   max_minutes: 5           # 0.5-30
#   screenshot_width: 1280   # 640-2560
#   step_delay_seconds: 0.6  # 0-3
#   mode: accept             # accept: adımlar sorulur | auto: sormaz (Esc durdurur)

openrouter_base_url: https://openrouter.ai/api/v1
anthropic_base_url: https://api.anthropic.com/v1
ollama_base_url: http://127.0.0.1:11434
