name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m bench.run --sahte
      - run: python -m bench.voice_latency --sahte --iterations 3
      - run: ruff check .
      - run: mypy
