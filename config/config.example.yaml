# Yollar bu dosyanın bulunduğu dizine göre çözülür.
workspace: ../desktop
state_dir: ../.artemis
audit_path: ../.artemis/audit.jsonl
language: tr  # Arayüz ve yanıt dili: tr | en (Ayarlar > Görünüm; yeniden başlatınca geçerli)
work_profile: work  # Çalışma profili (ADR 0083): work | game | private | meeting
max_steps: 8
max_seconds: 60
provider_timeout_seconds: 15
max_output_tokens: 1024
# Konuşma bağlamı (ADR 0012): modele verilen önceki tur sayısı; 0 kapatır.
context_turns: 6
persist_memory: true   # Geçmiş ve öz notlar state_dir/memory.sqlite3 içinde (ADR 0025).
context_token_budget: 6000
daily_budget_usd: '1.00'
allow_paid: false
allow_cloud_file_content: false
allow_cloud_clipboard: false
fallback_seconds: 60

# Resmi katalogdan model adını ve güncel milyon-token fiyatlarını doğrulayıp ekleyin.
# API anahtarlarını buraya YAZMAYIN. README ortam değişkenlerini açıklar.
primary_model: ''
fallback_model: null
models: {}
# Kendi OpenAI uyumlu ucunuz (ADR 0033): adres + isteğe bağlı anahtar. Anahtar YAML'a yazılmaz;
# ortamda ARTEMIS_<UC_ID>_API_KEY ya da Kimlik Bilgisi Yöneticisi'nde Artemis/<uc-id> olarak tutulur.
# endpoints:
#   yerel-proxy:
#     base_url: http://127.0.0.1:8317/v1   # http yalnız localhost için; uzak uç https olmalı
#   lm-studio:
#     base_url: http://127.0.0.1:1234/v1
#     api_key: false                       # anahtarsız yerel sunucu; Authorization gönderilmez
# models:
#   proxy-model:
#     provider: openai_compatible
#     endpoint: yerel-proxy
#     model: <sağlayıcının model kimliği>
#     input_per_million: '0'
#     output_per_million: '0'
#     # ADR 0092: hafif model kipi (dar araç seti, kısa istem). Boşsa otomatik: yerel/ollama ya da
#     # ':free' modelde açık, diğerlerinde kapalı.  true/false açık değeri ezer.
#     light_mode: true
#   # Pet üretici için resim modeli (ADR 0048 eki): sohbet modeli olarak seçilemez.
#   # Abonelik proxy'si ücretsiz sayılır; fiyatlı bir modelde allow_paid: true ve
#   # image_cost_usd (çağrı başına ayrılan üst tutar) şarttır.
#   pet-resim:
#     provider: openai_compatible
#     endpoint: yerel-proxy
#     model: gpt-image-2.5
#     kind: image
#     input_per_million: '0'
#     output_per_million: '0'
#     image_cost_usd: '0'
applications: {}
allow_all_applications: false # Windows Başlat menüsündeki tüm kurulu uygulamalar.
# Temiz turda bu izinli takma adlar yeniden onay almadan kapatılır.
# Dış içerik okunduktan sonraki kapatma yine onay ister.
close_without_confirmation: []

# Ses modelleri önceden ayrıca kurulmalıdır; Artemis çalışma anında indirme yapmaz.
# faster-whisper CUDA/float16 başlangıç profili; CPU için stt_device: cpu,
# stt_compute_type: int8 seçin.
voice:
  wake_word: artemis
  input_device: null # Paneldeki mikrofon seçimi; null sistem varsayılanıdır (ad ya da numara).
  followup_seconds: 8
  sample_rate: 16000
  frame_ms: 20
  vad_aggressiveness: 2
  vad_backend: auto # auto: Silero (paketle gelir), olmazsa webrtc
  vad_threshold: 0.5
  end_silence_ms: 600
  turn_detection: true # Sessizlikte cümle bitmiş mi diye bakar (Smart Turn, ADR 0068); bitmediyse daha çok bekler.
  turn_max_silence_ms: 1600 # Cümle bitmemiş görünürse en çok bu kadar sessizlik beklenir.
  turn_threshold: 0.5 # "Tur tamam" olasılığı eşiği.
  barge_in_ms: 180 # Uyandırmasız söz kesmede en kısa söz süresi (ADR 0042); VAD tek başına kesmez.
  require_wake_during_output: true # Yanıt/yankı aralığında yeni komut açık wake ister.
  barge_in_without_wake: true # Konuşurken herhangi bir söz susturur; komut için wake ya da takip sözü gerekir.
  followup_listening: false # true: yanıttan/susturmadan sonra "artemis" demeden dinler; tek başına "artemis" karşılığı takibi hep açar (ADR 0079 eki).
  wake_ack_text: Seni dinliyorum. # Uyandırma karşılığı (en çok 40 karakter); bir kez sentezlenip önbellekten çalınır.
  streaming: true # Model yazarken cümle cümle seslendirir (ADR 0043); başarı iddiası araç sonucunu bekler.
  continuous_mode: false # true: "artemis" demeden dinler (ADR 0024).
  telemetry_report: true # true: ses kapanınca içeriksiz gecikme raporu (state_dir/voice-telemetry/).
  listening_hotkey: ctrl+space # Masaüstünde sesi aç/kapat (Windows); boş: kapalı.
  ptt_enabled: false # true: Bas-konuş kısayolunu açar (basılı tutarken dinler, bırakınca işler).
  ptt_hotkey: '' # Bas-konuş kısayolu (ör. ctrl+alt+v); boş bırakılırsa kapalı.
  # Gürültü engelleme (ADR 0037): DeepFilterNet3, işlemcide çalışır, ekran kartı gerekmez.
  # Model pakete dahildir (indirme yok), yaklaşık 34 ms gecikme ekler. Yankı giderme DEĞİLDİR.
  noise_suppression: false
  noise_suppression_level: orta # hafif (12 dB sınır) | orta (24 dB) | guclu (sınırsız)
  # false (önerilen): temizlenmiş ses yalnız algılamaya (VAD, cümle bitişi, söz kesme, seviye)
  # gider; STT aynı aralığın HAM sesini alır. true: STT de temizlenmiş sesi alır (ADR 0037).
  noise_suppression_stt: false
  echo_cancellation: false # ADR 0038: hoparlörle kullanırken Artemis'in kendi sesini mikrofondan siler.
  echo_delay_ms: 50 # Hoparlör→mikrofon gecikme tahmini; AEC3 kendisi de ayarlar.
  # Verilmezse pakete dahil model (artemis/channels/voice/models/dfn3) kullanılır. Başka bir dizin
  # verilirse içinde aynı sha256'lı dfn3_step.onnx bulunmalıdır; farklı dosya reddedilir.
  # noise_model_dir: ../models/dfn3
  pre_roll_ms: 300
  max_utterance_seconds: 15
  queue_frames: 32
  stt_model: ../models/whisper-small
  stt_device: cuda # cuda | cpu. CUDA yoksa otomatik CPU'ya dönülmez; CPU makinede cpu yazın.
  stt_compute_type: float16 # Panelden seçilir: int8_float16 (az bellek, aynı doğruluk) | float16; CPU'da yok sayılır.
  stt_language: tr_en # Türkçe öncelikli; güçlü İngilizce kanıtında en. auto tüm dilleri seçer.
  cuda_library_dirs: [] # Windows: gerektiğinde yerel cublas/cudnn DLL dizinleri.
  stt_vad_filter: false # Whisper'ın kendi VAD süzgeci; kapalı (ADR 0045: bant sınırlı seste baştaki "Artemis"i kesiyor).
  stt_min_logprob: -1.0
  stt_max_no_speech: 0.6
  stt_beam_size: 5 # Kesin sonuç; daha yüksek değer daha yavaş olabilir.
  stt_partial_beam_size: 1
  stt_partial_enabled: true # Konuşurken ara tanıma; kısmi metin komut çalıştırmaz.
  stt_speculative: true # Bitiş sessizliğinde nihai tanımayı önceden başlatır (ADR 0071); konuşma sürerse atılır.
  stt_speculative_after_ms: 200 # Sessizliğin bu kadarında spekülatif tanıma başlar.
  game_mode: false # Tam ekran oyun öndeyken büyük STT modeli GPU'dan bırakılır, hafif model devralır (ADR 0072).
  game_mode_stt_model: null # Oyun modundaki hafif model; boşsa yerelde kurulu faster-whisper small.
  game_mode_target: local_light # local_light: hafif model dinler; cloud: Small CPU'da uyandırır, komut buluta gider (Small + bulut tanıma gerekir).
  stt_hotwords: [] # İsteğe bağlı yerel ipuçları; prompt veya transcript düzeltmesi değildir.
  stt_alias_hotwords: false # Öğretilmiş uygulama takma adlarının hedefleri STT ipucuna eklenir (ADR 0044).
  # Karma tanıma (ADR 0079): uyandırma, yankı ve söz kesme yerel metinle karar verilir; yalnız
  # KOMUT olan sözün SESİ aşağıdaki uca gider ("Artemis" tek başına, kısmi çözümler ve komut
  # olmayan konuşma gitmez). Kesintisiz kipte her söz komut sayıldığı için her söz gider.
  # Gizlilik: ses seçilen sağlayıcının sunucusuna aktarılır; hybrid seçmek açık izindir
  # (ayrı onay anahtarı yok). Ham ses diske yazılmaz. Anahtar config'e yazılmaz (ADR 0033: ortam
  # değişkeni ARTEMIS_<UÇ>_API_KEY veya Kimlik Bilgisi Yöneticisi). Bulut hatasında (8 sn
  # zaman aşımı dahil) yerel metin kullanılır, komut kaybolmaz.
  stt_mode: local # local | hybrid
  # Doğrudan sesli komut: komut sesi ayrı bulut STT adımına gitmeden doğrudan ses destekleyen
  # beyin modeline (ör. Gemini) gönderilir (gizlilik bedeli); desteklemeyen modelde yerel metne düşer.
  direct_audio_input: false
  # Çok kipli ses + ekran bağlamı (ADR 0085): yalnızca direct_audio_input ve
  # perception.allow_cloud_screen birlikte açıkken komut anındaki ekran PNG'si bellekte eklenir;
  # diske yazılmaz ve private çalışma profilinde kapalıdır.
  multimodal_screen_context: false
  # stt_cloud_endpoint: groq # Üstteki `endpoints` içinde tanımlı bir kimlik (hybrid için zorunlu).
  # stt_cloud_model: whisper-large-v3 # Sağlayıcının güncel belgesinden doğrulayın (hybrid için zorunlu).
  # stt_cloud_protocol: openai # openai (Whisper uyumlu /audio/transcriptions) | xai (/stt, model gerekmez; ADR 0050)
  # Canlı yazı (ADR 0047): konuşurken pet balonunda akan YALNIZ GÖSTERİM metni; komutu,
  # uyandırmayı, yankıyı ve söz kesmeyi etkilemez. Yerel, işlemcide çalışır (`pip install .[stream]`).
  # Model Artemis ile gelmez; ilk açılışta aşağıdaki SABİT revision'dan indirilir. Powered by mihu:
  # model mihu Community License v1.0 ile lisanslıdır (kişisel/ticari olmayan kullanım serbest;
  # ticari kullanım gelir sınırına ve mihu'nun şartlarına bağlıdır). Ayrıntı: THIRD_PARTY_NOTICES.md.
  live_transcript: false
  # live_transcript_model: mihuai/turkish-stt-66m-v2
  # live_transcript_revision: bc2f77287cfc3ec2568cf5ba9f9181e1a43bfff4
  # Uyandırma ön-kapısı (ADR 0069): kws = cihaz içi sözcük algısı, uyandırma sözü duyulmayan
  # konuşmayı Whisper'a göndermeden eler (CPU/gecikme kazancı). Yukarıdaki live_transcript_model
  # ve live_transcript_revision dolu olmalı; kurulamazsa transcript'e döner. Tek başına uyandırmaz.
  wake_backend: transcript # transcript | kws
  wake_kws_threshold: 0.2 # Düşük = daha çok yakalar, daha çok yanlış alarm.
  tts_backend: piper
  tts_local_fallback: true # Edge hatasında yerel sese dön; false seçili sesi korur.
  piper_model: ../models/tr_TR-dfki-medium.onnx
  piper_config: ../models/tr_TR-dfki-medium.onnx.json
  piper_voice: tr_TR-dfki-medium
  edge_voice: ''
  # Bulut konuşma sesi (ADR 0074): tts_backend: cloud seçildiğinde kullanılır.
  # OpenRouter örneği: tts_cloud_model: heygen/heygen-voice-1-turbo:free
  # tts_cloud_endpoint: openrouter # Üstteki `endpoints` içinde tanımlı bir kimlik
  # tts_cloud_protocol: openai     # openai (/audio/speech) | gemini (:streamGenerateContent?alt=sse)
  # tts_cloud_model: ''            # Bulut konuşma sesi model kimliği
  # tts_cloud_voice: ''            # Boşsa sağlayıcı varsayılanı kullanılır
  # tts_cloud_sample_rate: 24000   # Sağlayıcı hızı bildirmediğinde kullanılacak PCM örnekleme hızı
  # tts_cloud_allow_paid: false    # :free olmayan veya Gemini modelleri için açık ücretli izni
  # tts_cloud_emotion_tags: false  # Modelin desteklediği satır içi duygu etiketlerine izin ver
  # tts_cloud_emotion_tag_list: ["[laugh]", "[sigh]", "[whisper]", "[anger]"]  # Yalnız bulut TTS'e gider
  allow_cloud_tts_text: false
  ffmpeg: ffmpeg

# Obsidian vault hafızası (ADR 0015). KAPALI gelir: vault_path verilmedikçe araçlar
# diske dokunmaz. Vault okuması "dosya içeriği" sayılır: turu lekeler ve buluta ancak
# allow_cloud_file_content açıksa gider. Yazma yalnız ekleme kipindedir (mevcut not
# yeniden yazılmaz) ve her seferinde onay ister. Gizli klasörler (.git, .obsidian)
# ve exclude kalıpları aranmaz, okunmaz, yazılmaz.
memory:
#   vault_path: C:/Users/siz/Vault   # göreli yol bu dosyaya göre çözülür
#   exclude: [daily/, receipts/, knowledge/index.md, knowledge/log.md, 850-Companion/]
#   max_results: 5
#   max_note_chars: 20000
#   # Anlamsal arama için: pip install 'artemis-tr[memory]'; ilk aramada model iner.
#   # Paket veya model yoksa sözcük aramasına dönülür ve sonuçta bu yazılır.
#   embedding_model: null
#   embedding_cache_dir: null        # varsayılan: state_dir/embedding (vault DIŞINDA)
#   # "Açık/yarım işimiz var mı" sorusunda memory_open_work'ün okuyacağı vault dosyaları
#   # (vault'a göreli; exclude'u aşar ama yalnız bu araçtan okunur, tura eklenmez).
#   companion_vault_files: ["850-Companion/Threads.md", "850-Companion/Last-Session.md"]
#   # Konuşma hafızasını (memory.sqlite3) diskte Windows DPAPI ile şifreler (ADR 0076).
#   # Yeni kurulumlar şifrelidir; mevcut config dosyaları değişmez.
  encrypt_at_rest: true # Windows DPAPI. Windows dışında şifresiz devam eder ve uyarı loglanır.

# Telegram (ADR 0016). KAPALI gelir: chat_id verilmedikçe ne araç ne kanal çalışır.
# Bot token'ı BURAYA YAZILMAZ ve YAML'da `token:` alanı yoktur (eklenirse doğrulama
# reddeder). Token yalnız ortam değişkeninden okunur; adını token_env belirler ve
# _TOKEN ile bitmek zorundadır (denetim kaydı değeri bu sayede gizler).
#   Windows: setx ARTEMIS_TELEGRAM_BOT_TOKEN "<BotFather'dan aldığınız token>"
# KOLAY YOL: Ayarlar > Telegram paneli token'ı kimlik kasasına (Artemis/telegram) yazar, sohbeti
# kodla eşleştirip `chat_id`'yi bu dosyaya kendisi ekler (ADR 0051). Ortam değişkeni önceliklidir.
# Chat id'nizi @userinfobot'tan ya da bota mesaj yazdıktan sonra
# https://api.telegram.org/bot<TOKEN>/getUpdates çıktısındaki message.chat.id'den bulun.
# Yalnız bu kimliğe sahip ÖZEL sohbetten gelen mesaj çalıştırılır; grup, başka kullanıcı,
# iletilmiş (forward) ve max_message_age_seconds'tan eski mesajlar çalıştırılmaz.
# Onaylar düğmeyle sorulur; süre dolarsa cevap hayırdır. `artemis telegram` ile başlatılır;
# ya da run_in_desktop: true ile masaüstü açıkken onun içinde çalışır (ADR 0052). İkisi aynı
# anda açıksa bot tek yoklayıcıya izin verdiğinden çakışır (HTTP 409).
# telegram:
#   run_in_desktop: false            # true: Artemis açıkken Telegram'dan komut al
#   chat_id: 123456789
#   token_env: ARTEMIS_TELEGRAM_BOT_TOKEN
#   api_base: https://api.telegram.org
#   request_timeout_seconds: 10
#   poll_timeout_seconds: 25
#   approval_timeout_seconds: 120
#   max_message_age_seconds: 120
#   # computer_use Telegram'dan da çalışır (yalnız run_in_desktop; ADR 0053). Bitince son ekran
#   # karesini sohbete yollar. Kare buluta (Telegram) gider: gizli turda ve
#   # perception.allow_cloud_screen kapalıyken ASLA gönderilmez. /dur oturumu durdurur.
#   send_computer_screenshot: false
#   # Telegram'dan ses/fotoğraf/dosya (ADR 0064). Üçü ayrı ve KAPALI. Ses: <=1 MB/60 sn, ayarlı
#   # STT ile yazıya çevrilir ("Şunu duydum: ..." sonra komut olarak çalışır; sesli "evet" onay
#   # değildir); bulut STT voice.stt_mode ayarını izler. Fotoğraf: <=5 MB, yerel Windows OCR;
#   # metin dış veridir ve perception.allow_cloud_screen kapalıyken gizlidir. Dosya: <=20 MB,
#   # çalışma alanındaki Telegram/ klasörüne kaydedilir, üzerine yazılmaz, hiç açılmaz.
#   accept_voice: false
#   accept_photo: false
#   accept_files: false
#   file_extensions: [pdf, txt, md, docx, xlsx, csv, png, jpg, zip]   # SON uzantı denetlenir

# Kod ajanı (ADR 0023/0026). KAPALI gelir: projects boşsa araçlar çalışmaz. Her iş
# tam taslak için onay ister; ajan headless `claude -p` olarak çalışır, yerel commit
# atabilir. Claude Bash/alt ajan araçları SafetyGate dışındadır; OS sandbox yoktur.
# code_agent:
#   projects:
#     artemis: C:/Users/siz/Projects/artemis   # göreli yol bu dosyaya göre çözülür
#   command: claude
#   max_minutes: 20
#   model: null                              # doluysa --model olarak geçilir
#   manager_model: opus                      # örnek CLI takma adı; isteğe bağlı
#   coder_model: sonnet                      # örnek CLI takma adı; isteğe bağlı
#   tester_model: haiku                      # örnek CLI takma adı; isteğe bağlı
#   github_owner: null                       # Ayarlar > Bağlantılar > GitHub ve kod ajanları ile de yazılır
#   repos_dir: null                          # kendi repolarınızın klonlandığı klasör
#   auto_sync: true                          # açılışta klonla/fetch et

# Proaktif olaylar (ADR 0027). KAPALI gelir. Açıkken hatırlatma araçları çalışır ve
# `artemis desktop` ile `artemis telegram` süreçleri zamanlayıcıyı çalıştırır (ikisi aynı anda
# açıksa da her olay bir kez teslim edilir). Artemis kapalıyken hiçbir şey çalışmaz.
# Brifing istemini model kuramaz veya değiştiremez; yalnız buradan tanımlanır. Brifing
# gözetimsiz bir model turudur: yalnız okuma araçları çalışır, yan etkili her işlem
# sorulmadan reddedilir. Brifing tanımlamak ücretli model çağrısına izin vermektir;
# daily_budget_usd yine geçerlidir. Gizli içerik (dosya/pano) taşıyan sonuç Telegram'a
# gönderilmez. days: 0 = Pazartesi ... 6 = Pazar.
# proactive:
#   enabled: true
#   timezone: Europe/Istanbul
#   reminder_grace_hours: 12      # kapalıyken kaçan hatırlatma bu süre içinde "gecikmeli" gelir
#   briefing_grace_hours: 2       # daha geç açılırsa brifing o gün çalışmaz
#   max_events_per_day: 20
#   poll_seconds: 30
#   telegram: true                # telegram.chat_id ve token varsa oraya da gönder
#   briefings:
#     - name: sabah
#       at: "08:30"
#       days: [0, 1, 2, 3, 4]
#       prompt: >-
#         Bekleyen hatırlatmalarımı ve kod ajanı işlerinin durumunu kısaca özetle.

# Takvim ve posta (ADR 0059 okuma, ADR 0084 onaylı yazma). KAPALI gelir.
# Takvim okuma: Google/Outlook'un gizli ICS adresi (https zorunlu). Takvim yazma (CalDAV):
# allow_write: true ve caldav_url (https) gerekir; parola ARTEMIS_CALENDAR_CALDAV_PASSWORD ya da
# kimlik kasasındadır. Posta okuma: IMAP/TLS. Gönderme (SMTP): allow_send: true, smtp_host,
# smtp_port (465 SSL veya 587 STARTTLS) gerekir; parola ARTEMIS_MAIL_SMTP_PASSWORD (yoksa
# ARTEMIS_MAIL_PASSWORD) ya da kimlik kasasındadır. Sırlar YAML'a YAZILMAZ. allow_write ve
# allow_send açıkken bile her etkinlik/gönderim tam içerik önizlemesiyle onay ister ve
# gözetimsiz turda çalışmaz. İçerik kişiseldir: allow_cloud false iken bulut modele gitmez.
# calendar:
#   enabled: true
#   lookahead_days: 7        # 1-60; calendar_events en çok bu kadar gün bakar
#   allow_cloud: false
#   allow_write: false       # true iken calendar_create_event açılır (her zaman onaylı)
#   caldav_url: ""           # ör. https://caldav.example.com/calendars/user/default/
#   caldav_username: ""
# mail:
#   enabled: true
#   host: imap.gmail.com
#   port: 993
#   username: ben@example.com
#   folder: INBOX
#   max_messages: 10         # 1-50
#   allow_cloud: false
#   allow_send: false        # true iken mail_send açılır (her zaman onaylı)
#   smtp_host: smtp.gmail.com
#   smtp_port: 465           # 465: SSL | 587: STARTTLS
#   smtp_username: ben@example.com
# Sabah brifingine takvim ve posta eklemek için proactive.briefings[].prompt örneği (gözetimsiz
# turda yalnız READ_ONLY araçlar çalışır; ikisi de öyledir):
#   prompt: >-
#     Bugünkü takvimimi (calendar_events) ve önemli okunmamış postalarımı (mail_unread)
#     kısaca özetle; sonra bekleyen hatırlatmalarımı say.

# Kullanıcı becerileri (ADR 0060). KAPALI gelir. Açıkken state_dir/beceriler/ klasörüne elle
# yazdığınız <ad>.md dosyaları (başlıkta name ve description, altında Markdown tarif) Artemis'e
# yeni bir çalışma yöntemi öğretir; mesajı /<ad> ile başlatınca o beceri istenir. Klasör yoksa bir
# örnekle açılır. Beceri izin vermez: araç çağrıları normal onaydan geçer. Metin yerel kullanıcı
# metnidir; bulut modele giden istemin parçası olur. Klasör (varsayılan state_dir/beceriler) çalışma
# alanı, vault ve proje depolarının DIŞINDA olmalı, yoksa beceriler yüklenmez; state_dir bunlardan
# birinin içindeyse folder ile ayrı bir mutlak klasör verin.
# skills:
#   enabled: true
#   folder: C:/Users/<ad>/AppData/Local/Artemis/beceriler

# Gün sonu özeti (ADR 0066). KAPALI gelir; proactive.enabled gerekir. `at` saatinde (yerel,
# proactive.timezone) günün denetim kayıtlarından LLM'siz kısa bir Markdown yazılır:
# state_dir/gunluk/YYYY-MM-DD.md (tur sayıları, araçlar ve başarısızlar, dosya işlemleri, biten işler,
# hatırlatmalar, reddedilen onaylar, günün model harcaması). Konuşma metni ve araç sonuçları girmez.
# Boş gün dosya yazmaz. Uygulama kapalıyken kaçan gün, briefing_grace_hours içinde açılışta "gecikmeli"
# diye üretilir. Bildirimde "Aç" ve (memory.vault_path varsa) "Vault'a ekle" düğmesi çıkar; ekleme
# normal vault_append onayıyla vault_note'a yapılır, kendiliğinden hiçbir şey yazılmaz. Özet Telegram'a gitmez.
# daily_summary:
#   enabled: true
#   at: "22:30"
#   vault_note: Artemis-Gunluk.md

# Arka plan araştırma işi (ADR 0063). KAPALI gelir. "Şunu araştır" isteği arka planda web
# aramasıyla çalışır ve state_dir/arastirma/<iş-kimliği>.md raporunu yazar. Başlatma HER ZAMAN
# onay sorar; onay gösterilen konu için en fazla max_searches web araması içindir. İş kendi
# döngüsünde, boş geçmişle ve notlarınızı/hafızanızı/becerilerinizi görmeden çalışır; yalnız
# web_search aracı vardır. Rapor webden türer; kasaya kendiliğinden yazılmaz (istersen vault_append,
# normal onayla). Günlük bütçe ve allow_paid geçerlidir. Aynı anda tek araştırma çalışır.
# research:
#   enabled: true
#   max_searches: 12
#   max_seconds: 600

# Yerel dosya araması (ADR 0065). KAPALI gelir. Seçtiğin klasörlerde dosya adı ve içeriğiyle tam
# metin arama ("kira sözleşmesi geçen belge"). İndeks state_dir/dosya_arama.sqlite3'te durur
# (kişisel metin içerir; Ayarlar'dan "Dizini sil"). Açılışta ve "Yeniden dizinle" ile arka planda
# dizinlenir. Metin/kod/docx içeriği, PDF'in yalnız adı aranır. Bağlantılar, boyut sınırını aşan
# ve gizli görünen dosyalar (.env, *.pem, *.key, adında secret/token/password/credentials)
# dizinlenmez. roots mutlak klasör yollarıdır, yalnız sen yazarsın; state_dir ve beceri klasörü
# kök olamaz. Sonuç dosya içeriği sayılır: allow_cloud_file_content kapalıyken buluta gitmez.
# file_search:
#   enabled: true
#   roots:
#     - C:/Users/<ad>/Documents/Belgeler
#   max_file_mb: 5
#   exclude_dirs: [.git, node_modules, .venv, __pycache__, AppData]

# MCP sunucuları (ADR 0028). KAPALI gelir: servers boşken hiçbir süreç başlatılmaz.
# Yalnız stdio (yerel süreç) desteklenir; her çağrıda sunucu yeniden başlatılır ve iş
# bitince kapatılır. Sunucu üçüncü taraf koddur: kendi yaptıkları (ağ, dosya) SafetyGate'in
# dışındadır, kapı yalnız çağrıyı denetler. Her MCP aracı varsayılan olarak yan etkilidir
# ve dışarı giden (outbound) sayılır; sonucu turu lekeler. Sunucunun "readOnly" beyanı
# riski DÜŞÜRMEZ; bir aracı okuma-yalnız saymak için read_only_tools'a siz yazarsınız.
# read_only_tools/confirm_tools sunucunun HAM araç adlarıdır (mcp_<sunucu>_ öneki yok).
# read_only_tools'a yazılan aracın argümanları onay sorulmadan sunucuya (ve onun ağına)
# gider: yalnız gerçekten okuyan ve güvendiğiniz araçları yazın.
# content ZORUNLU: dosya/not/mail gibi kişisel veri döndüren sunucuda "file" seçin; bu
# sonuçlar buluta ve Telegram'a gitmez. Anahtar gerekiyorsa YAML'a yazmayın:
# env_passthrough yalnız ortam değişkeni ADINI listeler, değer o sunucuya aktarılır.
# Araç adları modele mcp_<sunucu>_<araç> olarak görünür.
# mcp:
#   servers:
#     - name: notlar
#       command: npx                     # Windows'ta npx.cmd otomatik çözülür; shell yok
#       args: ["-y", "@modelcontextprotocol/server-filesystem", "C:/Users/siz/Notlar"]
#       cwd: null
#       content: file
#       timeout_seconds: 20
#       read_only_tools: [read_text_file, list_directory, search_files]
#       confirm_tools: [write_file, move_file]
#       env_passthrough: []
#     # Artemis'in tarayıcı sunucusu (ADR 0032). Önce: pip install -e ".[browser]" ve
#     # python -m playwright install chromium. read_only_tools ÖNERİLMEZ: browse form doldurabilir.
#     - name: browser
#       command: "{python}"              # tam olarak bu: Artemis'in kendi Python'u
#       args: ["-m", "artemis.mcp_servers.browser"]
#       content: text
#       timeout_seconds: 90

# Ekran algısı (ADR 0029). KAPALI gelir. Açıkken "ekranda ne yazıyor" gibi isteklerde
# screen_read aracı etkin pencerenin (ya da istenirse tüm ekranın) metnini Windows'un
# yerel OCR'ıyla okur. HER okuma ekrandaki pencerede onay ister; brifing (gözetimsiz tur)
# ekranı okuyamaz. Görüntü diske yazılmaz ve hiçbir yere gönderilmez; yalnız metin döner.
# Ekran metni dosya/pano gibi gizlidir: allow_cloud_screen false iken bulut modele ve
# Telegram'a verilmez. Türkçe OCR için Windows'ta Türkçe dil paketi gerekir.
# perception:
#   screen_enabled: true
#   allow_cloud_screen: false
#   timeout_seconds: 20

# Pencere ve sistem kontrolü (ADR 0031). Uyku/kapatma/yeniden başlatma her zaman onay ister;
# kapatma bu kadar saniye sonra olur ve "kapatmayı iptal et" ile durdurulabilir (en az 30).
# system_control:
#   shutdown_delay_seconds: 60
#   timeout_seconds: 15

# Bilgisayar kullanımı (ADR 0039). KAPALI gelir; Artemis'in en riskli yeteneğidir. Açıkken
# computer_use(hedef) aracı tek onayla bir oturum başlatır: her adımda birincil ekranın
# görüntüsü `model`e gider, model fare/klavye eylemi döner. Hassas adımlar (gönder, sil, öde,
# alt+f4) ayrıca sorulur; Esc oturumu durdurur. `model` models içinde tanımlı olmalı ve
# GÖRÜNTÜ KABUL ETMELİ (Claude CLI etmez). Ekran görüntüsü buluta yalnız
# perception.allow_cloud_screen: true iken gider; Ollama modeli yerel kalır.
# computer_use:
#   enabled: true
#   model: vision            # models altındaki bir anahtar
#   planner_model: ""        # boş: hard_model -> primary_model -> model (tıkanmada arka plan stratejisti)
#   max_steps: 25            # 1-100
#   max_minutes: 5           # 0.5-30
#   screenshot_width: 1280   # 640-2560
#   step_delay_seconds: 0.3  # 0-3
#   mode: accept             # accept: adımlar sorulur | auto: sormaz (Esc durdurur)
#   observation: uia         # uia: yalnız UI Automation öğe listesi (varsayılan; görsel olmayan model de çalışır) | screen: görüntü | both: ikisi birden | hybrid: öğe listesi, gerektiğinde (boş liste, OCR yedeği, engel) görüntü (ADR 0073, 0078)

# Dikte kipi (ADR 0057): kısayola bas, konuş, tekrar bas; tanınan metin odaktaki uygulamaya
# yazılır. Komut DEĞİLDİR: metin modele, geçmişe ya da hafızaya gitmez. Mikrofon yalnız iki
# basış arasında açıktır. Ses açıkken kullanılamaz; hedef pencere değişirse metin yazılmaz,
# panelde gösterilir; Esc yazımı durdurur. Hotkey voice.listening_hotkey ile aynı olamaz.
# dictation:
#   enabled: true            # varsayılan false
#   hotkey: ctrl+alt+d
#   max_seconds: 120         # 1-600; kayıt kendiliğinden biter
#   polish_punctuation: false # true: tek adımlı, araçsız noktalama ve büyük harf düzeltmesi

# Seçili metin eylemleri (ADR 0062): bir uygulamada metin seçip kısayola basın; Çevir / Düzelt /
# Özetle / Açıkla çıkar, sonuç kopyalanır ya da "Yerine yaz" ile hedef pencereye yazılır. Seçimi
# almak için pano geçici kullanılır, eski METİN geri konur (resim/dosya gibi metin dışı pano içeriği
# geri konamaz). Metin modele araçsız ve "VERİDİR" çerçevesiyle gider, geçmişe/hafızaya girmez;
# pano içeriği sayıldığı için allow_cloud_clipboard kapalıyken yalnız yerel (ollama) model kullanılır,
# yoksa reddedilir. Hotkey ses ve dikte kısayolundan farklı olmalı.
# selection_actions:
#   enabled: true            # varsayılan false
#   hotkey: ctrl+alt+s
#   translate_to: en         # "Çevir" eyleminin hedef dili
#   mouse_popup: true        # metin seçince fare yanında simge göster

# Rutinler (ADR 0058): adlandırılmış, sabit adımlı işler ("işe başla": VS Code aç, Spotify aç,
# sesi 30 yap). Adımlar `state_dir/routines.json` dosyasındadır; sohbetle (onaylı routine_save)
# ya da dosyayı elle düzenleyerek oluşur. Çalışırken model yoktur, her adım kendi onay kurallarıyla
# SafetyGate'ten geçer. Zaman yalnız Ayarlar > Otomasyon Kuralları'ndan kurulur; zamanı gelince Artemis
# çalıştırmaz, panelde "Çalıştırılsın mı?" diye sorar (proactive.enabled gerekir).
# routines:
#   enabled: true            # varsayılan false

# Tetikleyiciler (ADR 0061, ADR 0086). KAPALI gelir; proactive.enabled gerekir. Desteklenen
# türler (`kind`): folder (varsayılan), app_opened, calendar_before, system_resume.
# Bildirimler yalnız yerel panelde gösterilir, LLM'siz sabit şablonlarla kurulur, en çok bir
# düğme taşır (`suggest` ya da `routine`) ve tıklamadan hiçbir şey çalıştırmaz; Telegram'a
# gönderilmez. Yalnız burada veya Ayarlar formundan tanımlanır, hiçbir araç ekleyemez.
# triggers:
#   enabled: true
#   items:
#     - name: indirilenler
#       kind: folder                       # folder | app_opened | calendar_before | system_resume
#       folder: C:/Users/ben/Downloads     # kind=folder için mutlak yol
#       pattern: "*.pdf"                   # varsayılan "*"
#       message: "Yeni dosya geldi: {file}"
#       suggest: "Şu dosyayı özetle: {path}"
#     - name: vscode-acildi
#       kind: app_opened
#       app: code.exe                      # ön planda açılan uygulama/süreç adı
#       cooldown_minutes: 30               # yeniden bildirme bekleme süresi (1-1440 dk)
#       message: "Uygulama açıldı: {app}"
#       routine: ise-basla                 # ya suggest ya routine (ikisi birden olmaz)
#     - name: toplanti-oncesi
#       kind: calendar_before
#       minutes_before: 10                 # 1-120 dk
#       title_filter: ""                   # isteğe bağlı başlık süzgeci
#       message: "Yaklaşan toplantı: {title} ({minutes} dk)"
#     - name: uyanis-ozeti
#       kind: system_resume
#       cooldown_minutes: 30
#       message: "Sistem uykudan uyandı"
#   chains:
#     - name: toplanti-sonrasi
#       enabled: true
#       after_routine: ise-basla           # ya da after_trigger: vscode-acildi
#       work_profiles: [work]              # boşsa tüm profiller
#       active_app: ""                     # isteğe bağlı etkin uygulama koşulu
#       time_range: "09:00-18:00"          # isteğe bağlı yerel saat aralığı
#       cooldown_minutes: 60
#       message: "Sıradaki adım önerisi: {source}"
#       routine: gunluk-notlar

openrouter_base_url: https://openrouter.ai/api/v1
anthropic_base_url: https://api.anthropic.com/v1
ollama_base_url: http://127.0.0.1:11434
