# Yollar bu dosyanın bulunduğu dizine göre çözülür.
workspace: ../desktop
state_dir: ../.jarvis
audit_path: ../.jarvis/audit.jsonl
max_steps: 8
max_seconds: 60
provider_timeout_seconds: 15
max_output_tokens: 1024
# Konuşma bağlamı (ADR 0012): modele verilen önceki tur sayısı; 0 kapatır.
context_turns: 6
persist_memory: true   # Geçmiş ve öz notlar state_dir/memory.sqlite3 içinde (ADR 0025).
context_token_budget: 6000
daily_budget_usd: '1.00'
allow_paid: false
allow_cloud_file_content: false
allow_cloud_clipboard: false
fallback_seconds: 60

# Resmi katalogdan model adını ve güncel milyon-token fiyatlarını doğrulayıp ekleyin.
# API anahtarlarını buraya YAZMAYIN. README ortam değişkenlerini açıklar.
primary_model: ''
fallback_model: null
models: {}
applications: {}
allow_all_applications: false # Windows Başlat menüsündeki tüm kurulu uygulamalar.
# Temiz turda bu izinli takma adlar yeniden onay almadan kapatılır.
# Dış içerik okunduktan sonraki kapatma yine onay ister.
close_without_confirmation: []

# Ses modelleri önceden ayrıca kurulmalıdır; Jarvis çalışma anında indirme yapmaz.
# faster-whisper CUDA/float16 başlangıç profili; CPU için stt_device: cpu,
# stt_compute_type: int8 seçin.
voice:
  wake_word: artemis
  followup_seconds: 8
  sample_rate: 16000
  frame_ms: 20
  vad_aggressiveness: 2
  end_silence_ms: 600
  barge_in_ms: 180 # Seslendirme sırasında bu kadar sürekli konuşma sesi susturur.
  require_wake_during_output: true # Yanıt/yankı aralığında yeni komut açık wake ister.
  continuous_mode: false # true: "artemis" demeden dinler (ADR 0024).
  pre_roll_ms: 300
  max_utterance_seconds: 15
  queue_frames: 32
  stt_model: ../models/whisper-small
  stt_device: cuda
  stt_compute_type: float16
  stt_language: tr_en # Türkçe öncelikli; güçlü İngilizce kanıtında en. auto tüm dilleri seçer.
  cuda_library_dirs: [] # Windows: gerektiğinde yerel cublas/cudnn DLL dizinleri.
  stt_vad_filter: true # Sessiz bölümleri STT öncesinde ele.
  stt_min_logprob: -1.0
  stt_max_no_speech: 0.6
  stt_beam_size: 5 # Kesin sonuç; daha yüksek değer daha yavaş olabilir.
  stt_partial_beam_size: 1
  stt_hotwords: [] # İsteğe bağlı yerel ipuçları; prompt veya transcript düzeltmesi değildir.
  tts_backend: piper
  tts_local_fallback: true # Edge hatasında yerel sese dön; false seçili sesi korur.
  piper_model: ../models/tr_TR-dfki-medium.onnx
  piper_config: ../models/tr_TR-dfki-medium.onnx.json
  piper_voice: tr_TR-dfki-medium
  edge_voice: ''
  allow_cloud_tts_text: false
  ffmpeg: ffmpeg

# Obsidian vault hafızası (ADR 0015). KAPALI gelir: vault_path verilmedikçe araçlar
# diske dokunmaz. Vault okuması "dosya içeriği" sayılır: turu lekeler ve buluta ancak
# allow_cloud_file_content açıksa gider. Yazma yalnız ekleme kipindedir (mevcut not
# yeniden yazılmaz) ve her seferinde onay ister. Gizli klasörler (.git, .obsidian)
# ve exclude kalıpları aranmaz, okunmaz, yazılmaz.
# memory:
#   vault_path: C:/Users/siz/Vault   # göreli yol bu dosyaya göre çözülür
#   exclude: [daily/, receipts/, knowledge/index.md, knowledge/log.md, 850-Companion/]
#   max_results: 5
#   max_note_chars: 20000
#   # Anlamsal arama için: pip install 'jarvis-tr[memory]'; ilk aramada model iner.
#   # Paket veya model yoksa sözcük aramasına dönülür ve sonuçta bu yazılır.
#   embedding_model: null
#   embedding_cache_dir: null        # varsayılan: state_dir/embedding (vault DIŞINDA)

# Telegram (ADR 0016). KAPALI gelir: chat_id verilmedikçe ne araç ne kanal çalışır.
# Bot token'ı BURAYA YAZILMAZ ve YAML'da `token:` alanı yoktur (eklenirse doğrulama
# reddeder). Token yalnız ortam değişkeninden okunur; adını token_env belirler ve
# _TOKEN ile bitmek zorundadır (denetim kaydı değeri bu sayede gizler).
#   Windows: setx JARVIS_TELEGRAM_BOT_TOKEN "<BotFather'dan aldığınız token>"
# Chat id'nizi @userinfobot'tan ya da bota mesaj yazdıktan sonra
# https://api.telegram.org/bot<TOKEN>/getUpdates çıktısındaki message.chat.id'den bulun.
# Yalnız bu kimliğe sahip ÖZEL sohbetten gelen mesaj çalıştırılır; grup, başka kullanıcı,
# iletilmiş (forward) ve max_message_age_seconds'tan eski mesajlar çalıştırılmaz.
# Onaylar düğmeyle sorulur; süre dolarsa cevap hayırdır. `jarvis telegram` ile başlatılır.
# telegram:
#   chat_id: 123456789
#   token_env: JARVIS_TELEGRAM_BOT_TOKEN
#   api_base: https://api.telegram.org
#   request_timeout_seconds: 10
#   poll_timeout_seconds: 25
#   approval_timeout_seconds: 120
#   max_message_age_seconds: 120

# Kod ajanı (ADR 0023/0026). KAPALI gelir: projects boşsa araçlar çalışmaz. Her iş
# tam taslak için onay ister; ajan headless `claude -p` olarak çalışır, yerel commit
# atabilir. Claude Bash/alt ajan araçları SafetyGate dışındadır; OS sandbox yoktur.
# code_agent:
#   projects:
#     jarvis: C:/Users/siz/Projects/jarvis   # göreli yol bu dosyaya göre çözülür
#   command: claude
#   max_minutes: 20
#   model: null                              # doluysa --model olarak geçilir
#   manager_model: opus                      # örnek CLI takma adı; isteğe bağlı
#   coder_model: sonnet                      # örnek CLI takma adı; isteğe bağlı
#   tester_model: haiku                      # örnek CLI takma adı; isteğe bağlı
#   github_owner: null                       # Ayarlar > GitHub ile de yazılır
#   repos_dir: null                          # kendi repolarınızın klonlandığı klasör
#   auto_sync: true                          # açılışta klonla/fetch et

openrouter_base_url: https://openrouter.ai/api/v1
anthropic_base_url: https://api.anthropic.com/v1
ollama_base_url: http://127.0.0.1:11434
